[package]
name = "order-lifecycle-ref"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(kani)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
wildcard_enum_match_arm = "deny"
missing_errors_doc = "allow"

[dev-dependencies]
proptest = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
stateright = "0.31"
