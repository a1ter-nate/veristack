name: Veristack CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-ts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build && node bin/vstack.mjs --help > /dev/null && node bin/vstack.mjs scan . --fail-on-cheats > /dev/null
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          bun ./src/cli.ts diff-cheats . --base "origin/$BASE_REF" --fail

  verify-csharp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build templates/csharp-reference/OrderLifecycle.slnx --warnaserror
      - run: dotnet test lint/csharp/VStack.Analyzers.Tests/VStack.Analyzers.Tests.csproj
      - run: dotnet test templates/csharp-reference/OrderLifecycle.slnx --no-build

  verify-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path templates/rust-reference/Cargo.toml --check
      - run: cargo clippy --manifest-path templates/rust-reference/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path templates/rust-reference/Cargo.toml

  verify-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      - run: uv run --project templates/python-reference ruff check templates/python-reference examples/python/clean
      - run: uv run --project templates/python-reference ruff format --check templates/python-reference examples/python/clean
      - run: uv run --project templates/python-reference mypy templates/python-reference/src templates/python-reference/tests examples/python/clean
      - run: PYTHONPATH=examples/python/clean uv run --project templates/python-reference pytest templates/python-reference examples/python/clean

  verify-go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: cd templates/go-reference && go vet ./... && go test -race -v ./...

  verify-bend2-laws:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: |
          curl -fsSL https://bend-lang.com/install.sh | sh
          ~/.bend/bin/bend templates/bend2-reference/PROOF.bend --check-only
      - run: bun src/cli.ts bench . --fail
