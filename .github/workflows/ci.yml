name: Veristack CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-verify-vstack-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Enforce zero ratchets and zero disabled-rule configs
        run: |
          if [ -f .vstack.json ] || [ -f .verification/vstack.json ]; then
            echo "Strict self-verification forbids .vstack.json overrides." >&2
            exit 1
          fi
          if git ls-files | grep -iE '(^|/)[^/]*ratchet[^/]*\.json$'; then
            echo "Strict self-verification forbids ratchet baseline files." >&2
            exit 1
          fi
      - name: Enforce 500-line hard maximum across all tracked files
        run: node scripts/check-max-lines.mjs
      - name: Enforce R6 performance and Big-O scaling budget
        run: bun run perf:check
      - name: Typecheck, lint, & FeatLock strict-drift guard
        run: |
          bun run typecheck
          bun run lint:oxlint
          bun run check:features
      - if: github.event_name == 'pull_request'
        name: Fetch PR base ref before strict control-plane verification
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=50 origin "$BASE_REF"
      - name: Build and run Veristack against itself (ephemeral-HMAC verify --strict & planted-fault canary)
        run: |
          bun run build
          node bin/vstack.mjs perimeter . --fail
          node bin/vstack.mjs verify . --strict
          node bin/vstack.mjs no-comments . --fail
          node bin/vstack.mjs state-machines . --fail
          node bin/vstack.mjs formal-sync . --fail
          node bin/vstack.mjs laws . --fail
          node bin/vstack.mjs bench . --fail
          node bin/vstack.mjs doctor . --fail
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          node bin/vstack.mjs diff-cheats . --base "origin/$BASE_REF" --fail
          node bin/vstack.mjs oracle-check . --base "origin/$BASE_REF" --test-cmd "bun test ./tests/ ./packages/ ./examples/typescript/clean/"

  verify-ts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=50 origin "$BASE_REF"
      - run: bun run test:packages
      - run: bun run check

  verify-csharp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build templates/csharp-reference/OrderLifecycle.slnx --warnaserror
      - run: dotnet test lint/csharp/VStack.Analyzers.Tests/VStack.Analyzers.Tests.csproj
      - run: dotnet test templates/csharp-reference/OrderLifecycle.slnx --no-build

  verify-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path templates/rust-reference/Cargo.toml --check
      - run: cargo clippy --manifest-path templates/rust-reference/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path templates/rust-reference/Cargo.toml

  verify-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
      - run: uv run --project templates/python-reference ruff check templates/python-reference examples/python/clean
      - run: uv run --project templates/python-reference ruff format --check templates/python-reference examples/python/clean
      - run: uv run --project templates/python-reference mypy templates/python-reference/src templates/python-reference/tests examples/python/clean
      - run: PYTHONPATH=examples/python/clean uv run --project templates/python-reference pytest templates/python-reference examples/python/clean

  verify-go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: cd templates/go-reference && go vet ./... && go test -race -v ./...

  verify-bend2-laws:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: |
          mkdir -p /tmp/bend-dl "$HOME/.bend"
          curl -fsSL -o /tmp/bend-dl/bend.tar.gz "https://github.com/bendlang/bend/releases/download/v2.0.40/bend-2.0.40-linux-x64.tar.gz"
          echo "c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b  /tmp/bend-dl/bend.tar.gz" | sha256sum -c -
          tar -xzf /tmp/bend-dl/bend.tar.gz -C "$HOME/.bend" --strip-components=1
          rm -rf /tmp/bend-dl
          ~/.bend/bin/bend templates/bend2-reference/PROOF.bend --check-only
      - run: bun src/cli.ts bench . --fail
